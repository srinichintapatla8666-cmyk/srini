{% extends 'myapp/base.html' %}

{% block body %} 
<div class= "m-10 flex space-x-10">
    <div>
        <img class="w-128 h-100 rounded-lg" src="{{ item.Item_image}}" alt="{{ item.Item_name }}">
    </div>
    <div class= "mx-16 space-y-5">
        <div class="text-4xl font-bold mb-2">{{ item.Item_name }}</div>
        <div class= "text-green-700 font-bold text-2xl">{{ item.Item_price }}</div>
        <div>{{ item.Item_desc }}</div>
          <div>

            <a class="bg-yellow-500 px-4 py-2 rounded-mg font-bold text-white"href="{% url 'myapp:update_item' item.id %}" >Edit</a>
            <a class="bg-red-500 px-4 py-2 rounded-mg font-bold text-white"href="{% url 'myapp:delete_item' item.id %}" >Delete</a>

          </div>
    </div>
</div>


 {% endblock %}

 {% comment %} <h1> {{ item.Item_name }}</h1>
<h1> {{ item.Item_desc }}</h1>
<h1> {{ item.Item_price }}</h1> {% endcomment %}
